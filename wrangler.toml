# Webent — static site only, no Worker, no database.
# Use this when you want the site online right now: copy it over wrangler.toml
# (rename this file to wrangler.toml) and Cloudflare deploys the built site.
# The contact form cannot send on a static-only deploy; it says so and offers WhatsApp.

name = "webent"
compatibility_date = "2025-01-15"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
